name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: |
          mkdir j && cd j
          curl -sSfL -o jei.jar "https://cdn.modrinth.com/data/u6dRKJwZ/versions/oXFV6wK5/jei-1.21.1-neoforge-19.71.0.475.jar"
          mkdir x && (cd x && unzip -q ../jei.jar)
          (cd x && find . -path "*api*" -iname "*mith*.class")
          for c in mezz.jei.api.registration.IVanillaCategoryExtensionRegistration mezz.jei.api.recipe.category.extensions.vanilla.smithing.IExtendableSmithingRecipeCategory mezz.jei.api.recipe.category.extensions.vanilla.smithing.ISmithingCategoryExtension mezz.jei.api.gui.ingredient.IRecipeSlotDrawable mezz.jei.api.recipe.category.extensions.vanilla.smithing.ISmithingRecipeSlots mezz.jei.api.registration.IRecipeRegistration mezz.jei.api.IModPlugin mezz.jei.api.constants.RecipeTypes; do echo "== $c"; javap -cp x $c 2>&1 | head -40; done
          echo "== how vanilla smithing recipes are collected"; (cd x && find . -iname "*SmithingRecipe*" | grep -v api | head)
          for c in $(cd x && find . -iname "SmithingRecipeCategory.class" | sed 's|^\./||;s/\.class$//'); do javap -p -cp x $c | head -40; done
