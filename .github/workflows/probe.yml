name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: |
          mkdir j && cd j
          curl -sSfL -o bc.jar "https://cdn.modrinth.com/data/5sy6g3kz/versions/VhIOvcXP/bettercombat-neoforge-2.4.0%2B1.21.1.jar"
          curl -sSfL -o pa.jar "https://cdn.modrinth.com/data/gedNE4y2/versions/HJZB6bmA/player-animation-lib-forge-2.0.4%2B1.21.1.jar"
          echo "== BC classes"; unzip -l bc.jar | awk '{print $4}' | grep -E "\.class$" | grep -v mixin | head -200
          echo "== BC mixins"; unzip -l bc.jar | awk '{print $4}' | grep -i mixin | head -80
          echo "== BC jsons"; unzip -l bc.jar | awk '{print $4}' | grep -E "json$|toml$" | head -60
          unzip -p bc.jar META-INF/neoforge.mods.toml
          echo "== PA"; unzip -l pa.jar | awk '{print $4}' | grep -E "\.class$" | grep -v "/impl/\|mixin" | head -150
          unzip -p pa.jar META-INF/neoforge.mods.toml META-INF/mods.toml 2>/dev/null | head -40
          mkdir bcx pax && (cd bcx && unzip -q ../bc.jar) && (cd pax && unzip -q ../pa.jar)
          for c in net/bettercombat/logic/PlayerAttackHelper net/bettercombat/logic/WeaponRegistry net/bettercombat/api/WeaponAttributes net/bettercombat/api/WeaponAttributesHelper net/bettercombat/api/AttackHand net/bettercombat/api/client/BetterCombatClientEvents net/bettercombat/api/MinecraftClient_BetterCombat net/bettercombat/api/EntityPlayer_BetterCombat net/bettercombat/client/BetterCombatClientMod net/bettercombat/api/component/BetterCombatDataComponents net/bettercombat/api/CombatFlags; do echo "== $c"; javap -p -cp bcx $c 2>&1 | head -60; done
          for f in $(cd bcx && ls net/bettercombat/api/*.class net/bettercombat/api/*/*.class 2>/dev/null); do echo "-- $f"; done
          echo "== PA api"; for c in $(cd pax && find dev -name "*.class" | grep -E "api/(PlayerAnimationAccess|layered/ModifierLayer|layered/IAnimation|PlayerAnimationFactory)|core/data/KeyframeAnimation.class|KeyframeAnimationPlayer.class|PlayerAnimationRegistry.class" | sed 's/\.class$//'); do echo "== $c"; javap -p -cp pax $c | head -50; done
          echo "== PA anim folder"; unzip -l bc.jar | grep -i "player_animations" | head -40
          echo "== mixins configs"; for m in $(unzip -l bc.jar | awk '{print $4}' | grep "mixins.json"); do unzip -p bc.jar $m; done
          echo "== MinecraftClientInject"; javap -p -c -cp bcx $(cd bcx && find . -name "MinecraftClientInject*.class" | head -1 | sed 's|^\./||;s/\.class$//') | grep -n "getMainHand\|invoke.*WeaponRegistry\|getAttributes\|method\|private\|public" | head -80
