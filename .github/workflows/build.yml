name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dirtrobes-jar
          path: build/libs/*.jar

      - name: Tests en jeu (GameTest)
        run: ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log; exit ${PIPESTATUS[0]}

      - name: Installer Curios pour le test serveur (dépendance optionnelle)
        run: |
          mkdir -p run/mods
          V=$(grep '^curios_version=' gradle.properties | cut -d= -f2)
          curl -fsSL -o "run/mods/curios-neoforge-$V.jar" "https://maven.theillusivec4.top/top/theillusivec4/curios/curios-neoforge/$V/curios-neoforge-$V.jar"
          # Better Combat + Player Animator + Cloth Config (intégrations optionnelles)
          BC=$(grep '^better_combat_version=' gradle.properties | cut -d= -f2)
          PA=$(grep '^player_animator_version=' gradle.properties | cut -d= -f2)
          CC=$(grep '^cloth_config_version=' gradle.properties | cut -d= -f2)
          curl -fsSL -o run/mods/bettercombat.jar "https://api.modrinth.com/maven/maven/modrinth/5sy6g3kz/$BC/5sy6g3kz-$BC.jar"
          curl -fsSL -o run/mods/playeranimator.jar "https://api.modrinth.com/maven/maven/modrinth/gedNE4y2/$PA/gedNE4y2-$PA.jar"
          JD=$(grep '^jade_version=' gradle.properties | cut -d= -f2)
          curl -fsSL -o run/mods/jade.jar "https://api.modrinth.com/maven/maven/modrinth/nvQzSEkH/$JD/nvQzSEkH-$JD.jar"
          JE=$(grep '^jei_version=' gradle.properties | cut -d= -f2)
          curl -fsSL -o run/mods/jei.jar "https://api.modrinth.com/maven/maven/modrinth/u6dRKJwZ/$JE/u6dRKJwZ-$JE.jar"
          CR=$(grep '^create_version=' gradle.properties | cut -d= -f2)
          curl -fsSL -o run/mods/create.jar "https://api.modrinth.com/maven/maven/modrinth/LNytGWDc/$CR/LNytGWDc-$CR.jar"
          curl -fsSL -o run/mods/clothconfig.jar "https://api.modrinth.com/maven/maven/modrinth/9s6osm5g/$CC/9s6osm5g-$CC.jar"
          ls -la run/mods

      - name: Test - démarrage d'un serveur avec le mod
        run: .github/scripts/server-smoke.sh

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: |
            server.log
            gametest.log
          if-no-files-found: ignore

      - name: Publier la dernière version (Release « latest »)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DirtRobes (dernière version)
          prerelease: true
          make_latest: false
          body: |
            Version compilée automatiquement depuis le commit ${{ github.sha }}.
            Mets le fichier .jar dans le dossier `mods` d'une instance NeoForge 1.21.1.
          files: build/libs/*.jar
