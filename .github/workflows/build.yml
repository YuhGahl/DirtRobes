name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dirtrobes-jar
          path: build/libs/*.jar

      - name: Test - démarrage d'un serveur avec le mod
        run: .github/scripts/server-smoke.sh

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore

      - name: Publier la dernière version (Release « latest »)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DirtRobes (dernière version)
          prerelease: true
          make_latest: false
          body: |
            Version compilée automatiquement depuis le commit ${{ github.sha }}.
            Mets le fichier .jar dans le dossier `mods` d'une instance NeoForge 1.21.1.
          files: build/libs/*.jar
